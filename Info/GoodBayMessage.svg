<svg width="854" height="80" viewBox="0 0 854 80" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Soft glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="854" height="80" fill="#0D1117"/>

  <!-- Main Text -->
  <text x="427" y="47"
        text-anchor="middle"
        font-size="20"
        font-family="Consolas, monospace"
        fill="url(#grad)"
        filter="url(#glow)">
    Thanks for visiting my profile 🚀
  </text>

  <!-- Moving highlight line (kept) -->
  <rect x="250" y="55" width="350" height="2" fill="url(#grad)" opacity="0.7">
    <animate attributeName="x"
             values="200;300;200"
             dur="2.5s"
             repeatCount="indefinite"/>
  </rect>

</svg>
