<svg width="854" height="240" viewBox="0 0 854 240" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Space -->
    <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Glass -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Gradient Text -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="18"
          flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="854" height="240" fill="url(#space)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.2"/>
    <circle cx="180" cy="70" r="1"/>
    <circle cx="330" cy="35" r="1.4"/>
    <circle cx="520" cy="60" r="1"/>
    <circle cx="710" cy="50" r="1.3"/>
    <circle cx="780" cy="140" r="1"/>
  </g>

  <!-- Floating Card -->
  <g>

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -6;0 0"
      dur="4s"
      repeatCount="indefinite"/>

    <g transform="skewX(-12) translate(40,0)">

      <!-- Shadow -->
      <rect
        x="160"
        y="60"
        width="520"
        height="120"
        rx="22"
        fill="#000"
        opacity="0.35"
        filter="url(#shadow)"/>

      <!-- Glass -->
      <rect
        x="150"
        y="50"
        width="520"
        height="120"
        rx="22"
        fill="url(#glass)"
        stroke="#ffffff"
        stroke-opacity="0.12"/>

      <!-- Glow -->
      <ellipse
        cx="410"
        cy="110"
        rx="200"
        ry="60"
        fill="#60A5FA"
        opacity="0.08"/>

      <!-- Name -->
      <text
        x="410"
        y="115"
        text-anchor="middle"
        font-size="44"
        font-weight="700"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        fill="url(#textGradient)"
        filter="url(#glow)">
        Husam Arasi
      </text>

      <!-- Subtitle -->
      <text
        x="410"
        y="150"
        text-anchor="middle"
        font-size="14"
        font-family="Inter,Segoe UI,Arial,sans-serif"
        fill="url(#textGradient)"
        opacity="0.9">
        Junior Software Developer • MIS Student
      </text>

    </g>

  </g>

</svg>
