<svg width="854" height="240" viewBox="0 0 854 240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Glass -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- SPACE BACKGROUND -->
  <rect width="854" height="240" fill="url(#space)"/>

  <!-- MOVING STARS (layer 1 slow) -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="40" r="1">
      <animate attributeName="cy" values="0;240" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="120" r="1.2">
      <animate attributeName="cy" values="0;240" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="60" r="1">
      <animate attributeName="cy" values="0;240" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="30" r="1.3">
      <animate attributeName="cy" values="0;240" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="90" r="1">
      <animate attributeName="cy" values="0;240" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="50" r="1.2">
      <animate attributeName="cy" values="0;240" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FAST STARS (layer 2 parallax) -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="120" cy="200" r="1">
      <animate attributeName="cy" values="0;240" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="180" r="1">
      <animate attributeName="cy" values="0;240" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="140" r="1">
      <animate attributeName="cy" values="0;240" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="220" r="1">
      <animate attributeName="cy" values="0;240" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- FLOATING CARD -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -6; 0 0"
      dur="4s"
      repeatCount="indefinite"
    />

    <g transform="skewX(-12) translate(40,0)">

      <!-- Shadow -->
      <rect
        x="160"
        y="60"
        width="520"
        height="120"
        rx="22"
        fill="#000"
        opacity="0.35"
        filter="url(#shadow)"
      />

      <!-- Glass card -->
      <rect
        x="150"
        y="50"
        width="520"
        height="120"
        rx="22"
        fill="url(#glass)"
        stroke="#ffffff"
        stroke-opacity="0.12"
      />

      <!-- Glow -->
      <ellipse cx="410" cy="110" rx="200" ry="60" fill="#60a5fa" opacity="0.08"/>

      <!-- NAME -->
      <text
        x="410"
        y="115"
        text-anchor="middle"
        font-size="44"
        font-weight="700"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        fill="#e5e7eb"
        filter="url(#glow)"
      >
        Husam Arasi
      </text>

      <!-- SUBTITLE (added under name) -->
      <text
        x="410"
        y="150"
        text-anchor="middle"
        font-size="14"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        fill="#93c5fd"
        opacity="0.85"
      >
        Junior Software Developer • MIS Student
      </text>

    </g>
  </g>

</svg>
